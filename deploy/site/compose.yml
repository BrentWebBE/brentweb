# Per-client site, lives in /srv/sites/<slug>/ next to its .env.
# Generated by scripts/new-client.sh. All values come from .env:
#   CLIENT_SLUG, DOMAIN, IMAGE, IMAGE_TAG  → used here (compose interpolation)
#   everything else                        → passed to the container (env_file)
name: ${CLIENT_SLUG:?set CLIENT_SLUG in .env}

services:
  web:
    image: ${IMAGE:?set IMAGE in .env}:${IMAGE_TAG:-latest}
    env_file: .env
    volumes:
      - media:/app/public/media
    networks:
      - traefik
      - mongo
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.services.${CLIENT_SLUG}.loadbalancer.server.port=3000

      # www → apex (308), site-local middleware
      - 'traefik.http.middlewares.${CLIENT_SLUG}-www.redirectregex.regex=^https?://www\.(.+)'
      - 'traefik.http.middlewares.${CLIENT_SLUG}-www.redirectregex.replacement=https://$${1}'
      - traefik.http.middlewares.${CLIENT_SLUG}-www.redirectregex.permanent=true

      # Main router: apex + www
      - 'traefik.http.routers.${CLIENT_SLUG}.rule=Host(`${DOMAIN:?set DOMAIN in .env}`) || Host(`www.${DOMAIN}`)'
      - traefik.http.routers.${CLIENT_SLUG}.entrypoints=websecure
      - traefik.http.routers.${CLIENT_SLUG}.tls.certresolver=letsencrypt
      - traefik.http.routers.${CLIENT_SLUG}.middlewares=${CLIENT_SLUG}-www
      - traefik.http.routers.${CLIENT_SLUG}.service=${CLIENT_SLUG}

      # Admin + login: same hosts, rate limited (deploy/traefik/admin-ratelimit.yml)
      - 'traefik.http.routers.${CLIENT_SLUG}-admin.rule=(Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)) && (PathPrefix(`/admin`) || Path(`/api/users/login`))'
      - traefik.http.routers.${CLIENT_SLUG}-admin.priority=100
      - traefik.http.routers.${CLIENT_SLUG}-admin.entrypoints=websecure
      - traefik.http.routers.${CLIENT_SLUG}-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.${CLIENT_SLUG}-admin.middlewares=${CLIENT_SLUG}-www,admin-ratelimit@file
      - traefik.http.routers.${CLIENT_SLUG}-admin.service=${CLIENT_SLUG}

networks:
  traefik:
    external: true
  mongo:
    external: true

volumes:
  media:
    name: ${CLIENT_SLUG}_media
