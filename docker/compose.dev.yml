# Local development database: MongoDB 8 as a single-node replica set (rs0).
# Payload needs a replica set for transactions.
#
#   docker compose -f docker/compose.dev.yml up -d
#   DATABASE_URI=mongodb://127.0.0.1:27017/brentweb?replicaSet=rs0
#
# Port 27017 is bound to localhost only.
name: brentweb-dev

services:
  mongo:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # One-shot init: creates the replica set on first start, no-op afterwards.
  # The member host is 127.0.0.1:27017 so drivers on the host machine can reach it
  # through the port mapping (and mongod recognises it as itself inside the container).
  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - |
        try {
          rs.status();
          print('Replica set rs0 already initialised');
        } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] });
          print('Replica set rs0 initialised');
        }

volumes:
  mongo-data:
  mongo-config:
